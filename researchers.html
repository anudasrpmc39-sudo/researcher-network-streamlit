<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Researchers in the Researcher Network.">
  <title>Researcher Network | Researchers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html"><span class="brand-mark">RN</span><span>Researcher Network</span></a>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
    <nav class="main-nav"><a href="index.html">Home</a><a class="active" href="researchers.html">Researchers</a><a href="projects.html">Projects</a></nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="section-label">Our Network</span>
      <h1>Researchers</h1>
      <p>Discover researchers, their expertise and potential areas for collaboration.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-bar">
        <input id="researcher-search" type="search" placeholder="Search by name, institution or research area..." aria-label="Search researchers">
        <select id="researcher-area" aria-label="Filter by research area">
          <option value="">All research areas</option>
          <option value="Health Informatics">Health Informatics</option>
          <option value="Digital Health">Digital Health</option>
          <option value="Epidemiology">Epidemiology</option>
          <option value="Public Health">Public Health</option>
          <option value="Artificial Intelligence">Artificial Intelligence</option>
        </select>
      </div>
      <div id="researcher-grid" class="card-grid three"></div>
      <p id="no-researchers" class="empty-state hidden">No researchers match your search.</p>
    </div>
  </section>
</main>

<div id="profile-modal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <button class="modal-close" data-close-modal aria-label="Close profile">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer class="site-footer"><div class="container footer-wrap"><span>© <span class="current-year"></span> Researcher Network</span><span>Research • Connect • Collaborate</span></div></footer>
<script src="script.js"></script>
</body>
</html>
